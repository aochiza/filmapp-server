version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: film-postgres

    environment:
      POSTGRES_DB: filmdb
      POSTGRES_USER: filmuser
      POSTGRES_PASSWORD: filmpassword

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: